<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>姆斯商店</title>
    <link rel="icon" href="{{ url_for('static', filename='images/LOGO.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .carousel-container { position: relative; width: 100%; height: 350px; overflow: hidden; background: #2ecc71; }
        .carousel-slide { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 1s; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .carousel-slide.active { opacity: 1; }
        .slide-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: brightness(0.7); }
        .search-overlay { position: absolute; bottom: 40px; width: 100%; z-index: 10; text-align: center; }
        .search-overlay input { padding: 12px 25px; border-radius: 25px; border: none; width: 60%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <header class="carousel-container">
        <div class="carousel-slide active">
            <img src="{{ url_for('static', filename='images/banner1.webp') }}" class="slide-bg">
            <h1 style="font-size: 3.5rem; margin: 0;">姆斯商店</h1>
            <p>專業遊戲代儲，安全快速</p>
        </div>
        <div class="carousel-slide">
            <img src="{{ url_for('static', filename='images/banner2.webp') }}" class="slide-bg">
            <h1 style="font-size: 3.5rem; margin: 0;" 姆斯官方Line:@musmus</h1>
            <p>所有遊戲皆有，如果以下價目表沒有，歡迎洽詢客服</p>
        </div>

        <div class="search-overlay">
            <form action="/" method="get">
                <input type="text" name="search" placeholder="搜尋遊戲..." value="{{ search_query or '' }}">
            </form>
        </div>
    </header>

    <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 40px;">
        {% for game in games %}
        <a href="/p/{{ game.id }}" class="game-card" style="text-decoration: none; color: black; text-align: center; border: 1px solid #eee; border-radius: 15px; overflow: hidden; background: white; transition: 0.3s;">
            <img src="{{ game.image_url or 'https://via.placeholder.com/200x150' }}" style="width: 100%; height: 160px; object-fit: cover;">
            <div style="padding: 15px;">
                <h3 style="margin: 0;">{{ game.game_name }}</h3>
            </div>
        </a>
        {% endfor %}
    </div>

    <script>
        let cur = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        setInterval(() => {
            slides[cur].classList.remove('active');
            cur = (cur + 1) % slides.length;
            slides[cur].classList.add('active');
        }, 5000);
    </script>
</body>
</html>
