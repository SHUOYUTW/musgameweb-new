<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="{{ url_for('static', filename='images/LOGO.png') }}" type="image/png">
    <meta charset="UTF-8">
    <title>姆斯商店</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header style="padding: 40px; text-align: center; background: #2ecc71; color: white;">
        <h1>姆斯商店</h1>
        <form action="/" method="get">
            <input type="text" name="search" placeholder="搜尋遊戲..." value="{{ search_query or '' }}" style="padding: 10px; border-radius: 20px; width: 60%;">
        </form>
    </header>

    <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px;">
        {% for game in games %}
        <a href="/price/{{ game.game_name }}" class="game-card" style="text-decoration: none; color: black; text-align: center; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; display: block;">
            {% if game.use_local %}
                <img src="{{ url_for('static', filename='images/' + game.image_url) }}" style="width: 100%; height: 150px; object-fit: cover;">
            {% else %}
                <img src="{{ game.image_url or 'https://via.placeholder.com/200x150' }}" style="width: 100%; height: 150px; object-fit: cover;">
            {% endif %}
            <div style="padding: 10px;">
                <h3>{{ game.game_name }}</h3>
            </div>
        </a>
        {% endfor %}
    </div>
</body>
</html>
