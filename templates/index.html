<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>姆斯商店</title>
    <link rel="icon" href="{{ url_for('static', filename='images/LOGO.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 看板容器：改為米白色，取消輪換相關設定 */
        .header-banner { 
            position: relative; 
            width: 100%; 
            height: 350px; 
            background: #F5F5DC; /* 米白色 */
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 0 20px;
        }
        
        /* 標題與內文顏色改為深色以配合米色背景 */
        .header-banner h1 { 
            font-size: 2.8rem; 
            color: #333; 
            margin: 0 0 15px 0; 
        }
        .header-banner p { 
            font-size: 1.3rem; 
            color: #555; 
            margin: 0; 
        }

        /* 搜尋框疊加 */
        .search-overlay { 
            margin-top: 30px; 
            width: 100%; 
            text-align: center; 
        }
        .search-overlay input { 
            padding: 12px 25px; 
            border-radius: 25px; 
            border: 1px solid #ddd; 
            width: 60%; 
            max-width: 500px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            outline: none; 
        }

        /* 遊戲網格 */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 25px; 
            padding: 40px; 
        }
        .game-card { 
            text-decoration: none; 
            color: black; 
            text-align: center; 
            border: 1px solid #eee; 
            border-radius: 15px; 
            overflow: hidden; 
            background: white; 
            transition: 0.3s; 
        }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body style="background: #fafafa; margin: 0;">
    <header class="header-banner">
        <h1>姆斯官方Line:@musmus</h1>
        <p>如果以下價目表沒有遊戲，歡迎洽詢客服</p>

        <div class="search-overlay">
            <form action="/" method="get">
                <input type="text" name="search" placeholder="搜尋遊戲..." value="{{ search_query or '' }}">
            </form>
        </div>
    </header>

    <main class="grid">
        {% for game in games %}
        <a href="/p/{{ game.id }}" class="game-card">
            <img src="{{ game.image_url or 'https://via.placeholder.com/200x150' }}" style="width: 100%; height: 160px; object-fit: cover;">
            <div style="padding: 15px;">
                <h3 style="margin: 0;">{{ game.game_name }}</h3>
            </div>
        </a>
        {% endfor %}
    </main>
</body>
</html>
