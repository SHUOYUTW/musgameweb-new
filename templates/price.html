<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{{ game_name }} - 價目表</title>
    <link rel="icon" href="{{ url_for('static', filename='images/LOGO.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .price-container { max-width: 800px; margin: 40px auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        .banner { height: 250px; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
        .banner h1 { color: white; background: linear-gradient(transparent, rgba(0,0,0,0.8)); width: 100%; margin: 0; padding: 30px 25px; }
        
        .price-list { list-style: none; padding: 0; margin: 0; }
        .price-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 22px 30px; 
            border-bottom: 1px solid #f8f8f8; 
        }
        .item-name { font-size: 1.15rem; color: #333; font-weight: 500; }
        .item-price { color: #e67e22; font-weight: bold; font-size: 1.35rem; }
    </style>
</head>
<body style="background: #F5F5DC;"> <div class="price-container">
        <div class="banner" style="background-image: url('{{ game_info.image_url or 'https://via.placeholder.com/800x250' }}');">
            <h1>{{ game_name }}</h1>
        </div>

        <div style="padding: 30px;">
            <a href="/" style="text-decoration: none; color: #333; font-weight: bold;">❮ 返回首頁</a>
            
            <div style="margin-top: 30px;">
                <ul class="price-list">
                    {% for item in items %}
                    <li class="price-item">
                        <span class="item-name">{{ item.item_name }}</span>
                        <span class="item-price">NT$ {{ "{:,.0f}".format(item.price) }}</span>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
