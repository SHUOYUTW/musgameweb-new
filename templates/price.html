<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="{{ url_for('static', filename='images/LOGO.png') }}" type="image/png">
    <meta charset="UTF-8">
    <title>{{ game_name }} - 價目表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #f4f7f6;">
    <div style="max-width: 800px; margin: 20px auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <div style="height: 200px; background-size: cover; background-position: center; display: flex; align-items: flex-end;
            background-image: url('{{ url_for('static', filename='images/' + game_info.image_url) if game_info.use_local else (game_info.image_url or 'https://via.placeholder.com/800x200') }}');">
            <h1 style="color: white; background: rgba(0,0,0,0.5); width: 100%; margin: 0; padding: 20px;">{{ game_name }}</h1>
        </div>
        <div style="padding: 20px;">
            <a href="/" style="text-decoration: none; color: #2ecc71; font-weight: bold;">❮ 返回列表</a>
            <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                <thead>
                    <tr style="border-bottom: 2px solid #eee;">
                        <th style="text-align: left; padding: 10px;">儲值品項</th>
                        <th style="text-align: right; padding: 10px;">價格</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr style="border-bottom: 1px solid #f5f5f5;">
                        <td style="padding: 15px 10px; display: flex; align-items: center;">
                            {% if item.use_local %}
                                <img src="{{ url_for('static', filename='images/' + item.item_image) }}" style="width: 40px; height: 40px; margin-right: 15px; border-radius: 5px;">
                            {% else %}
                                <img src="{{ item.item_image or 'https://via.placeholder.com/40' }}" style="width: 40px; height: 40px; margin-right: 15px; border-radius: 5px;">
                            {% endif %}
                            {{ item.item_name }}
                        </td>
                        <td style="text-align: right; color: #e67e22; font-weight: bold;">NT$ {{ "{:,.0f}".format(item.price) }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
